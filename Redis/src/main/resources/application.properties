server.port=8081

# MSSQL
spring.datasource.url=jdbc:sqlserver://195.230.127.185:1433;databaseName=javadb;trustServerCertificate=true
spring.datasource.username=javadbuser
spring.datasource.password=javadbpass
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Spring Cache
spring.cache.type=redis

#Log settings
logging.level.org.springframework=ERROR
logging.level.org.uniplovdiv=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{0} - %msg%n
